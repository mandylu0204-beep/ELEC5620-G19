[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campmate-backend"
version = "0.1.0"
description = "CampMate AI application foundation and shared contracts"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "tzdata>=2026.5; platform_system == 'Windows'",
  "uvicorn>=0.30,<1",
  "httpx>=0.28,<1",
  "reportlab==4.4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pypdf==6.10.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
app = ["assets/fonts/*.ttf", "assets/fonts/OFL.txt", "assets/fonts/README.md"]
